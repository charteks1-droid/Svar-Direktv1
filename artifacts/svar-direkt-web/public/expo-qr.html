<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expo QR – Svar Direkt</title>
<style>
  body { font-family: sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.1); max-width: 340px; }
  h2 { margin: 0 0 8px; color: #1a1a2e; font-size: 20px; }
  p { color: #666; font-size: 14px; margin: 0 0 24px; }
  img { border: 3px solid #0a7ea4; border-radius: 8px; }
  .url { font-size: 11px; color: #999; margin-top: 16px; word-break: break-all; }
  .step { background: #f0f9ff; border-radius: 8px; padding: 12px; margin-top: 16px; font-size: 13px; color: #0a7ea4; text-align: left; }
</style>
</head>
<body>
<div class="card">
  <h2>📱 Expo Go – Svar Direkt</h2>
  <p>Skanuj ten kod aparatem lub aplikacją Expo Go</p>
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=exp%3A%2F%2Fc11fb1aa-c8a5-494a-82d5-6e40e01b85cc-00-151780krlaqfm.expo.kirk.replit.dev" width="240" height="240" alt="QR Code">
  <div class="step">
    1. Zainstaluj <strong>Expo Go</strong> z Google Play<br>
    2. Otwórz Expo Go → "Scan QR code"<br>
    3. Zeskanuj powyższy kod<br>
    4. Aplikacja załaduje się na telefonie
  </div>
  <p class="url">exp://c11fb1aa-c8a5-494a-82d5-6e40e01b85cc-00-151780krlaqfm.expo.kirk.replit.dev</p>
</div>
</body>
